[package]
name = "nova-config"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Typed, comment-preserving TOML configuration files for desktop applications"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml_edit = { version = "0.23", features = ["serde"] }
tempfile = "3"
thiserror = "2"
toml = "0.9"
nova-eventbus = { path = "../Nova.EventBus" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync"] }

[[bin]]
name = "nova-config"
path = "src/main.rs"
